name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make autoconf g++ flex bison \
            help2man perl libfl-dev zlib1g-dev ccache

      - name: Cache Verilator
        id: cache-verilator
        uses: actions/cache@v4
        with:
          path: /usr/local
          key: verilator-v5.038

      - name: Build Verilator from source
        if: steps.cache-verilator.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/verilator/verilator
          cd verilator
          git checkout v5.038
          autoconf && ./configure
          make -j$(nproc)
          sudo make install

      - name: Install Python deps
        run: pip install cocotb pytest jinja2 pyyaml scapy hypothesis

      - name: Lint RTL
        run: verilator --lint-only -Wall rtl/*.sv

      - name: Hardware testbenches
        run: make -C tb
